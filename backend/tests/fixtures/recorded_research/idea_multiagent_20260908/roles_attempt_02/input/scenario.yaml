schema: idea_roles_scenario.v1
project: synthetic_regression
question: >-
  这是公开、符号化的二维标量函数逼近研究任务，不包含任何企业代码或数据。
  输入 (x,y) 在 [-1,1]^2，输出为一个实数。参考模型是固定均匀网格上的
  16×16 实数控制点二维 LUT，读取方式为双线性插值，共 256 个实数可训练参数。
  希望在总可训练实数参数不超过 256、保持输入输出定义的前提下，提出有机制区别的
  优化研究假设，改善对局部高曲率且采样不均匀的目标函数的拟合；这个瓶颈是假设，
  尚无观测数据支持。解释改哪里、为什么可能有效、哪些条件下不成立，给出可证伪预测，
  参数账本和公平比较思路。可以如实说明某个方向不值得尝试。不要宣称性能已提升。
  使用中文。task://public-lut-benchmark 是这份任务本身，只能支持任务条件，
  不能作为论文依据。本组件测试没有提供论文原文，也不执行检索工具。
evidence_refs:
  - task://public-lut-benchmark
constraints:
  - 总可训练实数参数不超过 256
  - 基线已使用双线性插值，不能将换成双线性插值作为新贡献
  - 不假定真实 PIMC 信号、代码、数据、性能指标或硬件含义
  - 文献新颖性、方法正确性和性能都需要进一步验证
discovery:
  initial_hypotheses: 3
  evolution_rounds: 1
  children_per_round: 1
  max_pairwise_matches: 4
  top_k: 1
roles:
  generation: &role
    provider: deepseek
    name: deepseek-v4-flash
    max_tokens: 8192
    temperature: 0.2
    thinking: false
    reasoning_effort: null
    timeout_seconds: 180
    max_retries: 0
  reflection: *role
  pairwise_judge: *role
  evolution: *role
  meta_review: *role
