schema: idea.focused.config.v1
author_agent: idea_author
review_agent: idea_reviewer
# Same GLM-5.3 model in separate author/reviewer sessions, explicitly selected.
# Set cross_model to require different provider/model pairs again.
review_mode: independent_session
author:
  # GLM-5.3 requires thinking and supports low, high or max effort.
  thinking_enabled: true
  reasoning_effort: low
  temperature: 0.2
  max_tokens: 8192
  request_timeout_seconds: 180
  max_retries: 1
loop:
  protocol: native_tools
  native_observation_history: true
  document_revisions_enabled: true
  submission_body_field: human_summary
  deduplicate_evidence_enabled: true
  mode: reflection
  trace: full
  input_token_budget: 128000
  observation_chars: 24000
  # All child calls additionally share the run resource ledger.
  max_model_calls: 60
  max_tool_steps: 36
  max_protocol_repairs: 2
  max_validation_repairs: 6
  author_empty_completion_repair_enabled: true
  # First review plus at most two focused revision/review rounds.
  max_reflections: 3
  reflection_thinking_enabled: true
  reflection_reasoning_effort: low
  reflection_format_repair_enabled: false
tools:
  - search.cvf_search
  - search.neurips_search
  - search.openalex_search
  - search.arxiv_search
  - search.web_search
  - search.fetch_sources
  - search.local_docs
  - knowledge.kb_query
  - code.repo_reader
