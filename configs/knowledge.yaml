embedding:
  # Deterministic Unicode lexical retrieval; this is NOT a neural embedding.
  # Old ASCII hash vectors are rescored from their stored source text.
  # For a real embedding model choose openai_compatible and set all service
  # fields below (or MARS_EMBEDDING_PROVIDER/MODEL/DIM/BASE_URL overrides).
  # Service failures are explicit; no local substitute is returned.
  provider: lexical_unicode
  dim: 256
  model: ""
  base_url: ""
  api_key_env: MARS_EMBEDDING_API_KEY
  timeout_seconds: 30

zones:
  # literature: PIM / passive-intermodulation cancellation papers, memory
  # polynomial & Volterra references, routing-routing surveys.
  literature:
    chunk_size: 1500
    overlap: 200
  # methodology: RES/PIM/APE measurement protocol, the ablation design
  # (order × memory-taps × router_type), dual-carrier signal-gen recipe.
  methodology:
    chunk_size: 2000
    overlap: 200
  # code_assets: reusable canceller modules / router implementations, kept
  # small-chunked so individual functions retrieve cleanly.
  code_assets:
    chunk_size: 800
    overlap: 50
  # run_archive: prior run_log.v1 results (RES/loss per ablation) for baseline
  # reuse and the Commander's failure-memory lookups.
  run_archive:
    chunk_size: 1000
    overlap: 100

baseline:
  match_threshold: 0.85        # cosine similarity to treat a prior run as a reusable baseline
  top_k: 3
