commander:
  enabled: true
  output_schema: ''
  model:
    context_window: 128000
    provider: zhipu
    model: glm-5.3
    temperature: 0.2
    # Thinking tokens and visible final text share this upper bound.
    max_tokens: 8192
    api_key_env: ZHIPU_API_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4
    base_url_env: ZHIPU_BASE_URL
    thinking:
      enabled: true
    reasoning_effort: low
    request_timeout_seconds: 120
    retry:
      max_retries: 2
      base_delay_seconds: 1
  debate:
    enabled: false
  role: supervisor_react
  loop:
    max_tool_steps: 12
  tools:
  - code.repo_list
  - code.repo_search
  - code.repo_read_lines
  - run.create
  - run.start
  - run.status
  - run.recovery_status
  - run.recover
  - run.feedback_loop
  - artifact.read
  - artifact.review
  - metrics.evaluate
  - diagnosis.failure_analysis
  - user.approval
idea:
  enabled: true
  output_schema: proposal.v1
  model:
    context_window: 128000
    provider: zhipu
    model: glm-5.3
    temperature: 0.7
    # Product default: billed output includes provider reasoning usage.
    max_tokens: 8192
    top_p: 1.0
    api_key_env: ZHIPU_API_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4
    base_url_env: ZHIPU_BASE_URL
    thinking:
      enabled: true
    reasoning_effort: low
    request_timeout_seconds: 360
    retry:
      max_retries: 2
      base_delay_seconds: 1
  debate:
    enabled: false
    rounds: 1
    participants:
    - role: proposer
      provider: zhipu
      model: glm-5.3
    - role: critic
      provider: zhipu
      model: glm-5.3
    - role: judge
      provider: zhipu
      model: glm-5.3
  research:
    max_delegations: 2
    required_tools: true
    enable_network: true
    source_downloads: true
    source_download_limit: 1
    web_search: true
  loop:
    protocol: native_tools
    native_observation_history: true
    mode: reflection
    trace: full
    # Tool-free Reflection may reason independently of the native action protocol.
    reflection_thinking_enabled: true
    reflection_reasoning_effort: low
    reflection_format_repair_enabled: false
    # Includes the submission schema, supplied context and visible paper excerpts.
    input_token_budget: 128000
    max_model_calls: 36
    max_validation_repairs: 6
    max_tool_steps: 18
  tools:
  - idea.research_delegate
  - search.local_docs
  - search.arxiv_search
  - search.web_search
  - search.fetch_sources
  - knowledge.kb_query
  - knowledge.baseline_match
  - code.repo_reader
idea_research:
  enabled: true
  output_schema: research_report.v1
  model:
    context_window: 128000
    provider: zhipu
    model: glm-5.3
    temperature: 0.2
    max_tokens: 8192
    api_key_env: ZHIPU_API_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4
    base_url_env: ZHIPU_BASE_URL
    thinking:
      enabled: true
    reasoning_effort: low
    request_timeout_seconds: 360
    retry:
      max_retries: 1
      base_delay_seconds: 1
  research:
    excerpt_context_chars: 600
    review_mode: whole_report
  debate:
    enabled: false
  loop:
    protocol: native_tools
    native_observation_history: true
    mode: reflection
    reflection_thinking_enabled: true
    reflection_reasoning_effort: low
    reflection_format_repair_enabled: false
    max_reflections: 2
    trace: full
    input_token_budget: 128000
    observation_chars: 16000
    max_model_calls: 16
    max_tool_steps: 12
    max_validation_repairs: 3
  tools:
  - search.openalex_search
  - search.arxiv_search
  - search.web_search
  - search.fetch_sources
  - search.local_docs
  - knowledge.kb_query
  - knowledge.baseline_match
experiment:
  enabled: true
