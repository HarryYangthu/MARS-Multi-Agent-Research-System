    retry:
      max_retries: 2
      base_delay_seconds: 1
  debate:
    enabled: false
    rounds: 1
    participants:
    - role: critic
      provider: zhipu
      model: glm-5.3
    - role: positive_reviewer
      provider: zhipu
      model: glm-5.3
  loop:
    mode: reflection
    input_token_budget: 128000
    max_validation_repairs: 1
    max_tool_steps: 8
  tools:
  - knowledge.methodology
  - knowledge.run_archive

