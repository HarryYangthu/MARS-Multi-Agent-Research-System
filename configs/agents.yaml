coding:
  enabled: true
  output_schema: code_spec.v1
  model:
    context_window: 128000
    provider: zhipu
    model: glm-5.3
    temperature: 0.1
    max_tokens: 8192
    api_key_env: ZHIPU_API_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4
    base_url_env: ZHIPU_BASE_URL
    thinking:
      enabled: true
    reasoning_effort: low
    request_timeout_seconds: 120
    retry:
      max_retries: 2
      base_delay_seconds: 1
  post_training:
    enabled: false
    mode: endpoint
    endpoint_provider: local_vllm
    adapter_path: ''
    custom_endpoint: http://127.0.0.1:8001/v1
    model: mars-coding-posttrain
    api_key_env: LOCAL_VLLM_API_KEY
    fine_tuned_model_id: ''
    live_checkpoint_path: ''
  language_tracks:
  - python_research
  - c_production
  loop:
    # Stop on validated delivery, real blockers, or explicit user cancellation.
    completion_driven: true
    protocol: native_tools
    mode: react
    native_observation_history: true
    input_token_budget: 128000
    max_validation_repairs: 2
    max_tool_steps: 20
  tools:
  - code.repo_reader
  - code.patch_generator
  - code.apply_patch
  - code.write_file
  - code.delete_file
  - code.rollback_patch
  - code.test_runner
  - code.lint
  - knowledge.code_assets
execution:
  enabled: true
  output_schema: run_log.v1
  runtime_mode: deterministic
  debate:
    enabled: false
  loop:
    input_token_budget: 128000
    max_validation_repairs: 1
    max_tool_steps: 6
  tools:
  - execution.log_streamer
  - execution.metrics_collector
writing:
