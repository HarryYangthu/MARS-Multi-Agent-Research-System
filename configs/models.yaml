# Provider registry — declares which providers are available.
# API keys come from .env via environment variables.

providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
  openai:
    api_key_env: OPENAI_API_KEY
  qwen:
    api_key_env: QWEN_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  gemini:
    api_key_env: GEMINI_API_KEY
  local_vllm:
    api_key_env: LOCAL_VLLM_API_KEY
    base_url_env: LOCAL_VLLM_BASE_URL
  custom:
    api_key_env: CUSTOM_ENDPOINT_API_KEY
    base_url_env: CUSTOM_ENDPOINT_URL
  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    base_url: https://api.deepseek.com/v1

  zhipu:
    api_key_env: ZHIPU_API_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4

# One short real request, no automatic retry or research dispatch.
connection_test:
  timeout_seconds: 30
  close_timeout_seconds: 2
  max_request_bytes: 16384
  max_tokens: 512
  prompt: "Reply with only OK to confirm the API connection."
