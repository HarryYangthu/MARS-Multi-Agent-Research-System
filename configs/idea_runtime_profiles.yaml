# Explicit service-start alternatives. The default remains configs/agents.yaml.
# Experimental: configuration adoption is not API or scientific acceptance.
# Keep product tools and project context; this is not an exact public-evaluation replay.
schema: idea.runtime_profiles.v1
profiles:
  experimental_research_pro_per_insight_v1:
    status: experimental
    validated: false
    lead:
      model:
        provider: deepseek
        name: deepseek-v4-pro
        max_tokens: 32768
        temperature: 0.1
        top_p: 1.0
        thinking: true
        reasoning_effort: low
        timeout_seconds: 360
        max_retries: 1
        retry_base_delay_seconds: 1
        api_key_env: DEEPSEEK_API_KEY
        base_url: https://api.deepseek.com/v1
