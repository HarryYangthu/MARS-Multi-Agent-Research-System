name: Core compatibility CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-deployment-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-click scripts without Docker or credentials
        shell: powershell
        run: .\deploy\windows\tests\Test-DeploymentScripts.ps1

  windows-deployment-pwsh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-click scripts without Docker or credentials
        shell: pwsh
        run: .\deploy\windows\tests\Test-DeploymentScripts.ps1

  backend-and-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.1
          uv lock --check
          uv sync --frozen --extra dev --python 3.11
          uv pip install --python .venv/bin/python --no-deps --editable projects/synthetic_regression
      - name: Real check subprocess interpreter and Git
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: .venv/bin/python -m pytest -q backend/tests/unit/test_check_interpreter.py backend/tests/unit/test_coding_approval.py::test_real_code_checks_use_the_selected_git_in_child_commands
      - name: Pytest
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: .venv/bin/python -m pytest backend/tests projects/synthetic_regression/tests -q --junitxml="${{ runner.temp }}/mars-core-pytest.xml"
      - name: Pytest totals
        if: always()
        env:
          MARS_PYTEST_JUNIT: ${{ runner.temp }}/mars-core-pytest.xml
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path(os.environ["MARS_PYTEST_JUNIT"])
          if not path.is_file():
              print(f"Pytest totals: missing XML report at {path}")
              raise SystemExit(1)
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          if not suites:
              raise ValueError("Pytest XML contains no testsuite")
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          print("Pytest totals: " + json.dumps(totals, sort_keys=True))
          PY
      - name: Research failure and recovery regressions
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: |
          .venv/bin/python -m pytest -q backend/tests/unit/test_coding_approval.py backend/tests/unit/test_completed_code_changes.py backend/tests/unit/test_completion_driven.py backend/tests/unit/test_run_recovery.py backend/tests/unit/test_model_accounting.py backend/tests/unit/test_model_attempt_budget.py backend/tests/unit/test_loop_generation_resume.py
      - name: Strict mypy
        env:
          MYPYPATH: .:backend:posttrain/src:projects/synthetic_regression/src
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: .venv/bin/python -m mypy --strict backend/ scripts/release projects/synthetic_regression/src
      - name: Import boundaries
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: .venv/bin/lint-imports
      - name: Twenty-candidate synthetic smoke
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: .venv/bin/python -m scripts.release.run_synthetic_smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Research activity, review prompt and code marker checks
        working-directory: frontend
        run: |
          npx tsc --outDir .tmp/research-activity --rootDir . --module commonjs --target ES2022 --moduleResolution node --skipLibCheck --esModuleInterop --noEmit false scripts/research-activity-smoke.ts
          node .tmp/research-activity/scripts/research-activity-smoke.js
          npx tsc --outDir .tmp/conversation-history --rootDir . --module commonjs --target ES2022 --moduleResolution node --skipLibCheck --esModuleInterop --noEmit false scripts/conversation-history-smoke.ts
          node .tmp/conversation-history/scripts/conversation-history-smoke.js
          npx tsc --outDir .tmp/review-prompt --rootDir . --module commonjs --target ES2022 --moduleResolution node --skipLibCheck --esModuleInterop --noEmit false scripts/review-prompt-smoke.ts
          node .tmp/review-prompt/scripts/review-prompt-smoke.js
          npx tsc --outDir .tmp/review-submission --rootDir . --module commonjs --target ES2022 --moduleResolution node --skipLibCheck --esModuleInterop --noEmit false scripts/review-submission-smoke.ts
          node .tmp/review-submission/scripts/review-submission-smoke.js
          npx tsc --outDir .tmp/literature-evidence --rootDir . --module commonjs --target ES2022 --moduleResolution node --skipLibCheck --esModuleInterop --noEmit false scripts/literature-evidence-smoke.ts
          node .tmp/literature-evidence/scripts/literature-evidence-smoke.js
          npx tsc --outDir .tmp/code-change-markers --rootDir . --module commonjs --target ES2022 --moduleResolution node --skipLibCheck --esModuleInterop --noEmit false scripts/code-change-markers-smoke.ts
          node .tmp/code-change-markers/scripts/code-change-markers-smoke.js
      - name: Production build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  desktop-boundaries:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop test dependencies
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Real process, gateway and resource boundary tests
        working-directory: desktop
        run: npm test
