name: Core compatibility CI

on:
  pull_request:
  push:
    branches: [main, "codex/windows-native"]

permissions:
  contents: read

jobs:
  windows-deployment-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\deploy\windows\tests\Test-DeploymentScripts.ps1
      - name: Validate native scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\deploy\windows-native\tests\Test-DeploymentScripts.ps1
      - name: Validate Docker scripts with PowerShell 7
        shell: pwsh
        run: .\deploy\windows\tests\Test-DeploymentScripts.ps1
      - name: Validate native scripts with PowerShell 7
        shell: pwsh
        run: .\deploy\windows-native\tests\Test-DeploymentScripts.ps1

  backend-and-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e projects/synthetic_regression
      - name: Pytest
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: |
          set +e
          pytest backend/tests projects/synthetic_regression/tests --tb=short -q 2>&1 | tee pytest.log
          test_exit=${PIPESTATUS[0]}
          if [ "$test_exit" -ne 0 ]; then
            failure=$(tail -80 pytest.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Backend pytest::$failure"
          fi
          exit "$test_exit"
      - name: Strict mypy
        env:
          MYPYPATH: .:backend:posttrain/src:projects/synthetic_regression/src
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: mypy --strict backend/ scripts/release projects/synthetic_regression/src
      - name: Import boundaries
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: lint-imports
      - name: Twenty-candidate synthetic smoke
        env:
          PYTHONPATH: .:backend:posttrain/src:projects/synthetic_regression/src
        run: python -m scripts.release.run_synthetic_smoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
