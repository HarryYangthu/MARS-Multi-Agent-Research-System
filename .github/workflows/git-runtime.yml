name: Portable Git runtime
on:
  pull_request:
    paths: ['backend/app/harness/runtime/git_runtime.py', 'backend/app/harness/tools/git_branch.py', 'backend/app/harness/tools/code/**', 'backend/app/harness/tools/process_runtime.py', 'backend/app/harness/persistence.py', 'backend/app/storage/research_creation_store.py', 'backend/app/harness/discovery/source_commit.py', 'backend/app/harness/runtime/readiness.py', 'backend/tests/unit/test_git_runtime.py', 'backend/tests/unit/test_persistence_locks.py', 'configs/git_runtime.yaml', 'deploy/windows-native/**', 'pyproject.toml', 'uv.lock', '.github/workflows/git-runtime.yml']
  push:
    paths: ['backend/app/harness/runtime/git_runtime.py', 'backend/app/harness/tools/git_branch.py', 'backend/app/harness/tools/code/**', 'backend/app/harness/tools/process_runtime.py', 'backend/app/harness/persistence.py', 'backend/app/storage/research_creation_store.py', 'backend/app/harness/discovery/source_commit.py', 'backend/app/harness/runtime/readiness.py', 'backend/tests/unit/test_git_runtime.py', 'backend/tests/unit/test_persistence_locks.py', 'configs/git_runtime.yaml', 'deploy/windows-native/**', 'pyproject.toml', 'uv.lock', '.github/workflows/git-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked Python dependencies
        shell: bash
        run: |
          python -m pip install uv==0.11.1
          uv lock --check
          uv sync --frozen --extra dev --python 3.11
      - name: Real Git, persistent lock and environment checks
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe -m pytest -q backend/tests/unit/test_git_runtime.py backend/tests/unit/test_persistence_locks.py
          else
            .venv/bin/python -m pytest -q backend/tests/unit/test_git_runtime.py backend/tests/unit/test_persistence_locks.py
          fi
      - name: Native Windows launcher checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/windows-native/Test-NativeScripts.ps1
