[project]
name = "mars-app"
version = "0.1.0"
description = "MARS peripheral app: run dashboard, research wizard and reports on top of mars-core"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pyyaml>=6", "optuna>=4.0", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "mistune>=3.0,<4"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
