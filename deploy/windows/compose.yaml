name: mars-v31-windows

services:
  redis:
    image: ${MARS_REDIS_IMAGE:-redis:7.4-alpine}
    platform: ${MARS_DOCKER_PLATFORM:-linux/amd64}
    user: "999:1000"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mars_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mars_internal

  backend:
    image: ${MARS_BACKEND_IMAGE:-mars-v31-backend:windows-amd64}
    platform: ${MARS_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile.backend
      args:
        MARS_PYTHON_IMAGE: ${MARS_PYTHON_IMAGE:-python:3.11-slim-bookworm}
        MARS_INSTALL_STATIC_ALPHA: ${MARS_INSTALL_STATIC_ALPHA:-1}
        MARS_INSTALL_SYSTEM_TOOLS: ${MARS_INSTALL_SYSTEM_TOOLS:-1}
        MARS_TORCH_VERSION: ${MARS_TORCH_VERSION:-2.12.1}
        MARS_TORCH_WHEEL_BASE_URL: ${MARS_TORCH_WHEEL_BASE_URL:-https://download.pytorch.org/whl/cpu}
        MARS_UV_VERSION: ${MARS_UV_VERSION:-0.11.1}
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_PORT: ${MARS_FRONTEND_PORT:-3001}
      REDIS_URL: redis://redis:6379/0
      CHROMADB_PATH: /app/knowledge/.chromadb
      MARS_CORS_ORIGINS: http://127.0.0.1:${MARS_FRONTEND_PORT:-3001},http://localhost:${MARS_FRONTEND_PORT:-3001}
      MARS_DISTRIBUTION: v31-wireless
      MARS_PROJECT_PACK_PATHS: /opt/mars-v31-wireless/project_packs
      MARS_EXECUTION_DEVICE: ${MARS_EXECUTION_DEVICE:-cpu}
      MARS_EXECUTION_BACKEND: ${MARS_EXECUTION_BACKEND:-mock}
      MARS_RUNTIME_MODE: ${MARS_RUNTIME_MODE:-development}
      MARS_MOCK_MODE: ${MARS_MOCK_MODE:-auto}
      MARS_DEFAULT_PROJECT: pimc
      MARS_PAPER_STATIC_PYTHON: /opt/venv/bin/python
      MARS_ENABLE_NETWORK_TOOLS: "false"
      PYTHONSAFEPATH: "1"
    ports:
      - "127.0.0.1:${MARS_BACKEND_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770
    volumes:
      - mars_runs:/app/runs
      - mars_workspace:/app/workspace
      - mars_knowledge:/app/knowledge
      - mars_configs:/app/configs
      - mars_runtime:/app/runtime
      - type: bind
        source: ./repo_link.demo.yaml
        target: /app/projects/pimc/repo_link.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MARS_V31_OVERLAY_PATH}/project_packs
        target: /opt/mars-v31-wireless/project_packs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MARS_V31_OVERLAY_PATH}/src
        target: /opt/mars-v31-wireless/src
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mars_internal

  frontend:
    image: ${MARS_FRONTEND_IMAGE:-mars-v31-frontend:windows-amd64}
    platform: ${MARS_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile.frontend
      args:
        MARS_NODE_IMAGE: ${MARS_NODE_IMAGE:-node:20-alpine}
        MARS_NPM_REGISTRY: ${MARS_NPM_REGISTRY:-https://registry.npmjs.org}
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:${MARS_BACKEND_PORT:-8000}
        NEXT_PUBLIC_WS_URL: ws://127.0.0.1:${MARS_BACKEND_PORT:-8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MARS_FRONTEND_PORT:-3001}:3000"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1770
      - /app/.next/cache:uid=1000,gid=1000,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mars_internal

networks:
  mars_internal:
    driver: bridge

volumes:
  mars_configs:
  mars_knowledge:
  mars_redis:
  mars_runtime:
  mars_runs:
  mars_workspace:
