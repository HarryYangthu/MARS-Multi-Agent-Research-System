# Only this descriptor is bundled. The referenced research repository is an
# external read-only mount and must never be copied into the MARS image.
project: pimc
repo_mode: local_path
repo_path: /mnt/pimc-repository
read_only: true
sync_strategy: snapshot
allowed_paths:
  - libs/
  - configs/
  - train_static.py
  - train_dynamic.py
  - Launch.sh
  - README.md
  - tests/
protected_paths:
  - baseline/
  - production_interface/
  - libs/model.py:Paper_Total_0327
baseline_rules_file: ./AGENTS.md
ignore_patterns:
  - "data/"
  - "*.npy"
  - "*.npz"
  - "*.pt"
  - "*.pth"
  - "*.ckpt"
  - "*.pkl"
  - "__pycache__/"
  - "runs/"
  - ".git/"
  - "logs/"
