schema_id: project_pack.v1
project_id: synthetic_regression
display_name: Synthetic Regression Discovery
pack_version: 1.0.0
requires_core: ">=3.0.0,<3.1.0"
distribution: public
capabilities:
  - model_discovery
  - deterministic_evaluation
  - synthetic_smoke
files:
  project: project.yaml
  rules: AGENTS.md
  repo_link: repo_link.yaml
  metrics: src/synthetic_regression_adapter/resources/metrics.yaml
  discovery: src/synthetic_regression_adapter/resources/discovery.yaml
  workflow: workflow.yaml
  ui_schema: ui_schema.json
adapters:
  evaluator:
    protocol: adapter.v1
    argv: ["{python}", -m, synthetic_regression_adapter]
    timeout_seconds: 30
    trusted: true
